<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Code Executor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Botão flutuante para abrir o editor -->
    <button id="floatingBtn" class="floating-btn" title="Code Executor">
        <span class="code-icon">&lt;/&gt;</span>
    </button>

    <!-- Painel do editor -->
    <div id="editorPanel" class="editor-panel">
        <div class="panel-header">
            <h1>Code Executor</h1>
            <button id="closeBtn" class="close-panel-btn">✕</button>
        </div>

        <!-- Abas principais -->
        <div class="main-tabs">
            <button class="main-tab-btn active" data-main-tab="editor">
                &lt; Editor
            </button>
            <button class="main-tab-btn" data-main-tab="lens">
                🔍 Lens
            </button>
        </div>

        <!-- Painel do Editor de Código -->
        <div class="main-tab-content active" id="editor-tab">
            <div class="editor-content">
                <div class="code-tabs">
                    <button class="tab-btn active" data-tab="html">HTML</button>
                    <button class="tab-btn" data-tab="css">CSS</button>
                    <button class="tab-btn" data-tab="js">JS</button>
                </div>

                <div class="editors">
                    <div class="tab-content active" id="html-tab">
                        <textarea id="htmlCode" placeholder="Digite seu código HTML..." spellcheck="false"></textarea>
                    </div>
                    <div class="tab-content" id="css-tab">
                        <textarea id="cssCode" placeholder="Digite seu código CSS..." spellcheck="false"></textarea>
                    </div>
                    <div class="tab-content" id="js-tab">
                        <textarea id="jsCode" placeholder="Digite seu código JavaScript..." spellcheck="false"></textarea>
                    </div>
                </div>

                <div class="button-group">
                    <button id="executeBtn" class="btn btn-primary">▶ Executar</button>
                    <button id="clearBtn" class="btn btn-danger">🗑 Limpar</button>
                </div>
            </div>
        </div>

        <!-- Painel do Image Lens -->
        <div class="main-tab-content" id="lens-tab">
            <div class="lens-content">
                <div class="lens-input-group">
                    <input type="file" id="imageInput" accept="image/*" class="image-input">
                    <label for="imageInput" class="image-label">📷 Selecione uma imagem</label>
                </div>

                <div id="imageContainer" class="image-container">
                    <img id="previewImage" style="display:none; max-width: 100%; border-radius: 8px;">
                </div>

                <div id="lensResults" class="lens-results"></div>

                <button id="analyzeBtn" class="btn btn-secondary" style="display:none;">🔍 Analisar</button>
            </div>
        </div>
    </div>

    <!-- Overlay -->
    <div id="overlay" class="overlay"></div>

    <!-- Preview -->
    <div id="previewPanel" class="preview-panel">
        <div class="preview-header">
            <span>Preview</span>
            <button id="closePreviewBtn" class="close-preview-btn">✕</button>
        </div>
        <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin allow-modals"></iframe>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <script src="popup.js"></script>
</body>
</html>
